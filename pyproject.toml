[project]
name = "discord-commerce-platform"
version = "0.1.0"
description = "Production-oriented Discord Commerce Platform"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.6,<3",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "httpx>=0.28,<1",
  "structlog>=25,<26",
  "python-dotenv>=1.1,<2",
  "PyNaCl>=1.5,<2",
  "sentry-sdk[fastapi]>=2.35,<3",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.58b0,<1",
  "opentelemetry-instrumentation-httpx>=0.58b0,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "bandit>=1.8,<2", "pip-audit>=2.9,<3"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.mypy]
python_version = "3.12"
strict = true
